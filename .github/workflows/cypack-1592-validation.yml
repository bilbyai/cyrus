name: CYPACK-1592 sandbox release validation
on:
  push:
    branches: [cypack-1592]
    paths:
      - .github/workflows/cypack-1592-validation.yml
      - apps/f1/test-drives/assets/cypack-1592-sandbox.mjs
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: ./.github/actions/install-dependencies
      - run: pnpm build
      - run: node apps/f1/test-drives/assets/cypack-1592-sandbox.mjs
